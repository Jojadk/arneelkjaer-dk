<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Siden findes ikke · Rådgiverguiden</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  html{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F7FB;color:#1A2332;font:400 17px/1.6 "IBM Plex Sans",system-ui,sans-serif;padding:16px}
  .box{max-width:480px;text-align:center}
  .code{font:600 13px "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:#1559B3}
  h1{font:600 clamp(28px,5vw,40px)/1.15 "IBM Plex Serif",Georgia,serif;margin:8px 0 12px}
  p{color:#55606F;margin:0 0 24px}
  a{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:10px;background:#1D6FD8;color:#fff;font-weight:600;text-decoration:none}
  a:hover{background:#1559B3}
</style>
</head>
<body>
  <div class="box">
    <div class="code">Fejl 404</div>
    <h1>Siden findes ikke</h1>
    <p>Siden er flyttet eller har aldrig eksisteret. Find svarene i guiden til byggerådgivning.</p>
    <a href="/">Gå til guiden</a>
  </div>
</body>
</html>
